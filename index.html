<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="一个简洁优雅的数独游戏，支持 4×4、6×6、9×9 三种棋盘与简单/中等/困难三个难度。">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" id="themeColor" content="#f2f3f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="数独">
  <title>数独 · Sudoku</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230066cc'/%3E%3Cg stroke='white' stroke-width='1.6' stroke-linecap='round'%3E%3Cpath d='M6 14.5h20M6 21.5h20M14.5 6v20M21.5 6v20'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <script>
    /* 在样式表加载前恢复主题，避免深色模式闪白 */
    (function () {
      var mode = 'auto';
      try {
        var stored = window.localStorage.getItem('sudoku-theme-v1');
        if (stored === 'light' || stored === 'dark' || stored === 'auto') mode = stored;
      } catch (err) { /* 隐私模式下忽略 */ }
      var dark = mode === 'dark';
      if (mode === 'auto' && window.matchMedia) {
        dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      }
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme-mode', mode);
      var meta = document.getElementById('themeColor');
      if (meta) meta.setAttribute('content', dark ? '#000000' : '#f2f3f7');
    })();
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="title-block">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <defs>
                <linearGradient id="brandGrad" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#3d9bff"></stop>
                  <stop offset="1" stop-color="#0066cc"></stop>
                </linearGradient>
              </defs>
              <rect x="2" y="2" width="20" height="20" rx="6.5" fill="url(#brandGrad)"></rect>
              <g stroke="rgba(255,255,255,0.92)" stroke-width="1.3" stroke-linecap="round">
                <path d="M8.7 3.2v17.6M15.3 3.2v17.6M3.2 8.7h17.6M3.2 15.3h17.6"></path>
              </g>
            </svg>
          </span>
          <h1>数独</h1>
        </div>
        <p class="subtitle" id="modeBadge">9×9 · 中等</p>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn topbar-icon" id="recordsBtn" type="button" title="我的记录" aria-label="我的记录">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 20V10M10 20V4M16 20v-6M22 20H2"></path>
          </svg>
        </button>
        <button class="icon-btn topbar-icon" id="settingsBtn" type="button" title="设置" aria-label="设置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3.1"></circle>
            <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1Z"></path>
          </svg>
        </button>
        <button class="btn btn-primary btn-small" id="newGameBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
            <path d="M12 5v14M5 12h14"></path>
          </svg>
          新游戏
        </button>
      </div>
    </header>

    <main class="app-main">
      <div class="status-row">
        <div class="status-group">
          <span class="status-chip status-chip-timer">
            <svg class="chip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12.5" r="8.2"></circle>
              <path d="M12 8.4v4.4l2.9 1.7M9.4 2.6h5.2"></path>
            </svg>
            <span class="timer" id="timer">00:00</span>
          </span>
          <span class="status-chip status-chip-stat">
            <svg class="chip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 8.2v4.6"></path>
              <circle cx="12" cy="16.6" r="0.9" fill="currentColor" stroke="none"></circle>
              <circle cx="12" cy="12" r="8.4"></circle>
            </svg>
            <span class="stat-label">错误</span>
            <strong id="mistakes">0</strong>
          </span>
          <span class="status-chip status-chip-stat">
            <svg class="chip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9.4 18.6h5.2M10.4 21.6h3.2"></path>
              <path d="M12 2.4a6.6 6.6 0 0 0-3.9 11.9c.6.5 1.1 1.2 1.1 2v.5h5.6v-.5c0-.8.5-1.5 1.1-2A6.6 6.6 0 0 0 12 2.4Z"></path>
            </svg>
            <span class="stat-label">提示</span>
            <strong id="hints">0</strong>
          </span>
        </div>
        <button class="icon-btn" id="pauseBtn" type="button" title="暂停 / 继续 (P)" aria-label="暂停游戏">
          <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <rect x="6.5" y="4.5" width="4" height="15" rx="1.6"></rect>
            <rect x="13.5" y="4.5" width="4" height="15" rx="1.6"></rect>
          </svg>
          <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M8 4.8v14.4a1 1 0 0 0 1.53.85l11.2-7.2a1 1 0 0 0 0-1.7L9.53 3.95A1 1 0 0 0 8 4.8Z"></path>
          </svg>
        </button>
      </div>

      <div class="board-shell">
        <div class="board" id="board" role="grid" aria-label="数独棋盘"></div>

        <div class="overlay" id="pauseOverlay" role="dialog" aria-modal="true" aria-labelledby="pauseTitle" hidden>
          <div class="overlay-card">
            <p class="overlay-title" id="pauseTitle">已暂停</p>
            <p class="overlay-sub">继续游戏后计时会恢复</p>
            <button class="btn btn-primary" id="resumeBtn" type="button">继续游戏</button>
          </div>
        </div>

        <div class="overlay" id="loadingOverlay" role="status" aria-live="polite" hidden>
          <div class="overlay-card overlay-card-small">
            <span class="spinner" aria-hidden="true"></span>
            <p class="overlay-sub">正在生成题目…</p>
          </div>
        </div>
      </div>

      <div class="hint-card" id="hintCard" hidden role="status" aria-live="polite">
        <div class="hint-card-head">
          <span class="hint-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9.4 18.6h5.2M10.4 21.6h3.2"></path>
              <path d="M12 2.4a6.6 6.6 0 0 0-3.9 11.9c.6.5 1.1 1.2 1.1 2v.5h5.6v-.5c0-.8.5-1.5 1.1-2A6.6 6.6 0 0 0 12 2.4Z"></path>
            </svg>
          </span>
          <strong class="hint-title" id="hintTitle">提示</strong>
          <button class="hint-close" id="hintClose" type="button" aria-label="关闭提示">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
              <path d="M6 6l12 12M18 6L6 18"></path>
            </svg>
          </button>
        </div>
        <p class="hint-message" id="hintText"></p>
      </div>

      <div class="controls">
        <div class="toolbar">
          <button class="tool" id="notesBtn" type="button" title="笔记模式 (N)" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 20h9"></path>
              <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
            </svg>
            <span>笔记</span>
          </button>
          <button class="tool" id="undoBtn" type="button" title="撤销 (Ctrl+Z)" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 14 4 9l5-5"></path>
              <path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"></path>
            </svg>
            <span>撤销</span>
          </button>
          <button class="tool" id="eraseBtn" type="button" title="擦除 (Backspace)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m7 21-4-4L13 7l4 4L7 21Z"></path>
              <path d="m13 7 4-4 4 4-4 4"></path>
              <path d="M3 21h18"></path>
            </svg>
            <span>擦除</span>
          </button>
          <button class="tool" id="hintBtn" type="button" title="提示 (H)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 18h6"></path>
              <path d="M10 22h4"></path>
              <path d="M12 2a7 7 0 0 0-4.2 12.6c.7.5 1.2 1.3 1.2 2.1V18h6v-1.3c0-.8.5-1.6 1.2-2.1A7 7 0 0 0 12 2Z"></path>
            </svg>
            <span>提示</span>
          </button>
        </div>

        <div class="pad" id="pad" role="group" aria-label="数字键盘"></div>

        <div class="controls-footer">
          <p class="hint-text">数字键或下方按键填入</p>
          <div class="footer-actions">
            <button class="text-btn" id="installBtn" type="button" hidden>安装 App</button>
            <button class="text-btn" id="restartBtn" type="button">重玩本局</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- 新游戏弹窗 -->
  <div class="modal-backdrop" id="newGameModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="newGameTitle">
      <div class="modal-head">
        <div>
          <h2 id="newGameTitle">新游戏</h2>
          <p class="modal-sub">选择尺寸和难度</p>
        </div>
        <button class="close-btn js-cancel-new" type="button" aria-label="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18"></path>
          </svg>
        </button>
      </div>

      <div class="size-options" id="sizeOptions">
        <button class="size-card" type="button" data-size="4">
          <span class="mini-grid" data-size="4" aria-hidden="true"></span>
          <strong>4×4</strong>
          <span>轻松</span>
        </button>
        <button class="size-card" type="button" data-size="6">
          <span class="mini-grid" data-size="6" aria-hidden="true"></span>
          <strong>6×6</strong>
          <span>进阶</span>
        </button>
        <button class="size-card" type="button" data-size="9">
          <span class="mini-grid" data-size="9" aria-hidden="true"></span>
          <strong>9×9</strong>
          <span>经典</span>
        </button>
      </div>

      <p class="modal-section-title">难度</p>
      <div class="difficulty-options" id="difficultyOptions">
        <button class="diff-btn" type="button" data-difficulty="easy">简单</button>
        <button class="diff-btn" type="button" data-difficulty="medium">中等</button>
        <button class="diff-btn" type="button" data-difficulty="hard">困难</button>
      </div>
      <p class="difficulty-desc" id="difficultyDesc"></p>

      <div class="modal-actions">
        <button class="btn btn-secondary js-cancel-new" type="button">取消</button>
        <button class="btn btn-primary" id="startGameBtn" type="button">开始游戏</button>
      </div>
    </div>
  </div>

  <!-- 胜利弹窗 -->
  <div class="win-backdrop" id="winOverlay" hidden>
    <div class="win-card" role="dialog" aria-modal="true" aria-labelledby="winTitle">
      <div class="win-check" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="m5 12.5 4.5 4.5L19 7.5"></path>
        </svg>
      </div>
      <h2 id="winTitle">完成！</h2>
      <p class="win-sub" id="winDifficulty">9×9 · 中等</p>
      <div class="win-stats">
        <div class="win-stat"><span>用时</span><strong id="winTime">00:00</strong></div>
        <div class="win-stat"><span>错误</span><strong id="winMistakes">0</strong></div>
        <div class="win-stat"><span>提示</span><strong id="winHints">0</strong></div>
      </div>
      <div class="win-actions">
        <button class="btn btn-secondary" id="changeSettingsBtn" type="button">换个难度</button>
        <button class="btn btn-primary" id="playAgainBtn" type="button">再来一局</button>
      </div>
    </div>
  </div>

  <!-- 重玩确认弹窗 -->
  <div class="modal-backdrop" id="restartModal" hidden>
    <div class="modal modal-compact" role="dialog" aria-modal="true" aria-labelledby="restartTitle" aria-describedby="restartDesc">
      <div class="restart-badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 14 4 9l5-5"></path>
          <path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"></path>
        </svg>
      </div>
      <h2 id="restartTitle">重玩本局？</h2>
      <p class="modal-sub" id="restartDesc">当前填入的数字、笔记和用时都会被清除，题目保持不变。</p>
      <div class="modal-actions">
        <button class="btn btn-secondary js-cancel-restart" id="restartCancelBtn" type="button">取消</button>
        <button class="btn btn-primary" id="restartConfirmBtn" type="button">重新开始</button>
      </div>
    </div>
  </div>

  <!-- 设置弹窗 -->
  <div class="modal-backdrop" id="settingsModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" aria-describedby="settingsDesc">
      <div class="modal-head">
        <div>
          <h2 id="settingsTitle">设置</h2>
          <p class="modal-sub" id="settingsDesc">外观与本地数据</p>
        </div>
        <button class="close-btn js-cancel-settings" type="button" aria-label="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18"></path>
          </svg>
        </button>
      </div>

      <p class="modal-section-title">外观</p>
      <div class="theme-options" id="themeOptions" role="group" aria-label="外观主题">
        <button class="theme-card" type="button" data-theme-mode="auto" aria-pressed="true">
          <span class="theme-preview theme-preview-auto" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="6.6" fill="#ffffff" stroke="rgba(60,60,67,0.35)" stroke-width="1"></circle>
              <path d="M12 5.4a6.6 6.6 0 0 1 0 13.2Z" fill="#1c1c1e"></path>
            </svg>
          </span>
          <strong>跟随系统</strong>
          <span>随系统自动切换</span>
        </button>
        <button class="theme-card" type="button" data-theme-mode="light" aria-pressed="false">
          <span class="theme-preview theme-preview-light" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="#f5a623" stroke-width="1.7" stroke-linecap="round">
              <circle cx="12" cy="12" r="3.6" fill="#f5a623" stroke="none"></circle>
              <path d="M12 3.2v2M12 18.8v2M3.2 12h2M18.8 12h2M5.8 5.8l1.4 1.4M16.8 16.8l1.4 1.4M18.2 5.8l-1.4 1.4M7.2 16.8l-1.4 1.4"></path>
            </svg>
          </span>
          <strong>浅色</strong>
          <span>始终使用浅色</span>
        </button>
        <button class="theme-card" type="button" data-theme-mode="dark" aria-pressed="false">
          <span class="theme-preview theme-preview-dark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M20.2 14.8A8.4 8.4 0 0 1 9.2 3.8a8.5 8.5 0 1 0 11 11Z" fill="#4da3ff"></path>
            </svg>
          </span>
          <strong>深色</strong>
          <span>始终使用深色</span>
        </button>
      </div>
      <p class="settings-note">主题、游戏进度和记录都只保存在这台设备上，不会上传。</p>

      <div class="modal-actions">
        <button class="btn btn-primary js-cancel-settings" type="button">完成</button>
      </div>
    </div>
  </div>

  <!-- 我的记录弹窗 -->
  <div class="modal-backdrop" id="recordsModal" hidden>
    <div class="modal modal-records" role="dialog" aria-modal="true" aria-labelledby="recordsTitle">
      <div class="modal-head">
        <div>
          <h2 id="recordsTitle">我的记录</h2>
          <p class="modal-sub">只保存在这台设备上</p>
        </div>
        <button class="close-btn js-cancel-records" type="button" aria-label="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18"></path>
          </svg>
        </button>
      </div>

      <div class="record-summary" id="recordSummary"></div>
      <p class="record-empty" id="recordEmpty" hidden>还没有完成记录。完成一局数独后，成绩会自动保存在这里。</p>

      <section class="record-section" id="recordBestSection">
        <p class="modal-section-title">最佳成绩</p>
        <div class="record-bests" id="recordBests"></div>
      </section>

      <section class="record-section" id="recordListSection">
        <p class="modal-section-title">最近完成</p>
        <ul class="record-list" id="recordList"></ul>
      </section>

      <div class="modal-actions record-actions">
        <button class="btn btn-secondary" id="clearRecordsBtn" type="button">清空记录</button>
        <button class="btn btn-primary js-cancel-records" type="button">完成</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <noscript>
    <p style="text-align:center;padding:40px">这个游戏需要启用 JavaScript 才能运行。</p>
  </noscript>

  <script src="sudoku-core.js"></script>
  <script src="sudoku-hints.js"></script>
  <script src="app.js"></script>
</body>
</html>
