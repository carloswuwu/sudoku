<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#060a13">
  <meta name="description" content="一个可以在电脑上玩的数独游戏，支持 4×4、6×6、9×9 三种棋盘与简单/中等/困难三个难度。">
  <title>数独 · Sudoku</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f172a'/%3E%3Cg stroke='%2322d3ee' stroke-width='1.6' stroke-linecap='round'%3E%3Cpath d='M6 14.5h20M6 21.5h20M14.5 6v20M21.5 6v20'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <rect x="3" y="3" width="18" height="18" rx="4"></rect>
            <path d="M9 3v18M15 3v18M3 9h18M3 15h18"></path>
          </svg>
        </div>
        <div class="brand-text">
          <h1>数独</h1>
          <p class="tagline">4 × 4 &nbsp;·&nbsp; 6 × 6 &nbsp;·&nbsp; 9 × 9</p>
        </div>
      </div>
      <div class="topbar-right">
        <span class="mode-badge" id="modeBadge">9×9 · 中等</span>
        <button class="btn primary" id="newGameBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M12 5v14M5 12h14"></path>
          </svg>
          新游戏
        </button>
      </div>
    </header>

    <main class="layout">
      <section class="play-area" aria-label="棋盘区域">
        <div class="meta-row">
          <div class="meta-item timer-item">
            <span class="meta-label">时间</span>
            <strong id="timer" class="meta-value timer">00:00</strong>
          </div>
          <button class="pause-btn" id="pauseBtn" type="button" title="暂停 / 继续 (P)" aria-label="暂停游戏">
            <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <rect x="6.5" y="4.5" width="4" height="15" rx="1.4"></rect>
              <rect x="13.5" y="4.5" width="4" height="15" rx="1.4"></rect>
            </svg>
            <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M8 4.8v14.4a1 1 0 0 0 1.53.85l11.2-7.2a1 1 0 0 0 0-1.7L9.53 3.95A1 1 0 0 0 8 4.8Z"></path>
            </svg>
          </button>
          <span class="meta-divider" aria-hidden="true"></span>
          <div class="meta-item">
            <span class="meta-label">错误</span>
            <strong id="mistakes" class="meta-value">0</strong>
          </div>
          <div class="meta-item">
            <span class="meta-label">提示</span>
            <strong id="hints" class="meta-value">0</strong>
          </div>
        </div>

        <div class="board-shell">
          <div class="board" id="board" role="grid" aria-label="数独棋盘"></div>

          <div class="overlay pause-overlay" id="pauseOverlay" hidden>
            <p class="overlay-title">已暂停</p>
            <button class="resume-btn" id="resumeBtn" type="button" aria-label="继续游戏">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M8 4.8v14.4a1 1 0 0 0 1.53.85l11.2-7.2a1 1 0 0 0 0-1.7L9.53 3.95A1 1 0 0 0 8 4.8Z"></path>
              </svg>
            </button>
            <p class="overlay-sub">点击继续，或按 <kbd>P</kbd></p>
          </div>

          <div class="overlay loading-overlay" id="loadingOverlay" hidden>
            <span class="spinner" aria-hidden="true"></span>
            <p class="overlay-sub">正在生成题目…</p>
          </div>
        </div>

        <p class="hint-text">
          点击格子后按数字键填入 · <kbd>N</kbd> 笔记 · <kbd>Ctrl</kbd>+<kbd>Z</kbd> 撤销 · <kbd>H</kbd> 提示 · <kbd>P</kbd> 暂停
        </p>
      </section>

      <aside class="panel" aria-label="操作面板">
        <div class="toolbar">
          <button class="tool" id="notesBtn" type="button" title="笔记模式 (N)" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 20h9"></path>
              <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
            </svg>
            <span>笔记</span>
          </button>
          <button class="tool" id="undoBtn" type="button" title="撤销 (Ctrl+Z)" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 14 4 9l5-5"></path>
              <path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"></path>
            </svg>
            <span>撤销</span>
          </button>
          <button class="tool" id="eraseBtn" type="button" title="擦除 (Backspace)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m7 21-4-4L13 7l4 4L7 21Z"></path>
              <path d="m13 7 4-4 4 4-4 4"></path>
              <path d="M3 21h18"></path>
            </svg>
            <span>擦除</span>
          </button>
          <button class="tool" id="hintBtn" type="button" title="提示 (H)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 18h6"></path>
              <path d="M10 22h4"></path>
              <path d="M12 2a7 7 0 0 0-4.2 12.6c.7.5 1.2 1.3 1.2 2.1V18h6v-1.3c0-.8.5-1.6 1.2-2.1A7 7 0 0 0 12 2Z"></path>
            </svg>
            <span>提示</span>
          </button>
        </div>

        <div class="pad" id="pad" aria-label="数字键盘"></div>

        <div class="panel-footer">
          <button class="text-btn" id="restartBtn" type="button">重玩本局</button>
          <span class="panel-tip">自动保存进度</span>
        </div>
      </aside>
    </main>

    <footer class="footnote">
      <span>每一行、每一列、每一个粗线宫格内，数字 1–N 均只出现一次。</span>
    </footer>
  </div>

  <!-- 新游戏弹窗 -->
  <div class="modal-backdrop" id="newGameModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="newGameTitle">
      <div class="modal-head">
        <div>
          <h2 id="newGameTitle">新游戏</h2>
          <p class="modal-sub">选择棋盘尺寸与难度</p>
        </div>
        <button class="close-btn js-cancel-new" type="button" aria-label="关闭">×</button>
      </div>

      <div class="size-options" id="sizeOptions">
        <button class="size-card" type="button" data-size="4">
          <span class="mini-grid" data-size="4" aria-hidden="true"></span>
          <strong>4 × 4</strong>
          <span>轻松热身</span>
        </button>
        <button class="size-card" type="button" data-size="6">
          <span class="mini-grid" data-size="6" aria-hidden="true"></span>
          <strong>6 × 6</strong>
          <span>恰到好处</span>
        </button>
        <button class="size-card" type="button" data-size="9">
          <span class="mini-grid" data-size="9" aria-hidden="true"></span>
          <strong>9 × 9</strong>
          <span>经典挑战</span>
        </button>
      </div>

      <div class="modal-section-title">难度</div>
      <div class="difficulty-options" id="difficultyOptions">
        <button class="diff-btn" type="button" data-difficulty="easy">简单</button>
        <button class="diff-btn" type="button" data-difficulty="medium">中等</button>
        <button class="diff-btn" type="button" data-difficulty="hard">困难</button>
      </div>
      <p class="difficulty-desc" id="difficultyDesc"></p>

      <div class="modal-actions">
        <button class="btn ghost js-cancel-new" type="button">取消</button>
        <button class="btn primary" id="startGameBtn" type="button">开始游戏</button>
      </div>
    </div>
  </div>

  <!-- 胜利弹窗 -->
  <div class="win-backdrop" id="winOverlay" hidden>
    <div class="win-card" role="dialog" aria-modal="true" aria-labelledby="winTitle">
      <div class="win-emblem" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 21h8"></path>
          <path d="M12 17v4"></path>
          <path d="M17 4H7v5a5 5 0 0 0 10 0V4Z"></path>
          <path d="M7 6H4v2a3 3 0 0 0 3 3"></path>
          <path d="M17 6h3v2a3 3 0 0 1-3 3"></path>
        </svg>
      </div>
      <h2 id="winTitle">恭喜完成！</h2>
      <p class="win-sub" id="winDifficulty">9×9 · 中等</p>
      <div class="win-stats">
        <div class="win-stat"><span>用时</span><strong id="winTime">00:00</strong></div>
        <div class="win-stat"><span>错误</span><strong id="winMistakes">0</strong></div>
        <div class="win-stat"><span>提示</span><strong id="winHints">0</strong></div>
      </div>
      <div class="win-actions">
        <button class="btn ghost" id="changeSettingsBtn" type="button">换个难度</button>
        <button class="btn primary" id="playAgainBtn" type="button">再来一局</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <div class="confetti-layer" id="confetti" aria-hidden="true"></div>

  <noscript>
    <p style="text-align:center;padding:40px;color:#e2e8f0">这个游戏需要启用 JavaScript 才能运行。</p>
  </noscript>

  <script src="sudoku-core.js"></script>
  <script src="app.js"></script>
</body>
</html>
